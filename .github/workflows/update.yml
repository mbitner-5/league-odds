name: Update and publish

on:
  schedule:
    - cron: '0 5 * * *'        # midnight Eastern (standard time): fresh projections
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        run: |
          node next/test/unit.js
          node next/test/engine_regress.js
          node src/test_engine.js

      - name: Last good projection files
        uses: actions/cache@v4
        with:
          path: .shared
          key: shared-${{ github.run_id }}
          restore-keys: shared-

      # The home page takes any league. /next/ (the old preview address) and /cherrypie/ forward to it.
      - name: Build the site with this week's projections
        run: |
          mkdir -p dist/next dist/cherrypie .shared
          cp -r next/index.html next/js dist/
          cp next/redirect.html dist/next/index.html
          cp next/cherrypie.html dist/cherrypie/index.html
          if node scripts/build_shared.mjs .shared-new; then cp -r .shared-new/. .shared/; else echo "::warning::Projection pull failed, publishing the last good files"; fi
          cp -r .shared dist/data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
