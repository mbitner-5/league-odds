<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap" rel="stylesheet">
<style>
:root {
  /* Layout idea: one white column. League name, one model switch, four tabs. Each tab leads with a heat table
     you can read at arm's length; the soft-gray what-if panel sits under it, or beside it on wide screens. */
  --page: #ffffff;         /* the whole page */
  --soft: #f4f6f8;         /* what-if panel, detail drawers, quiet fills */
  --ink: #14181d;          /* text */
  --muted: #5d6772;        /* secondary text */
  --line: #dfe4e9;         /* rules */
  --accent: #1757ac;       /* taps, picks, your team */
  --accent-soft: #e8f1fc;
  --ramp-lo: #eef4fb;      /* odds ramp: more likely is darker */
  --ramp-hi: #0e3d7e;
  --up: #006c10;
  --down: #b42318;
  --font: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; }
h1, h2, h3, h4, p, ul { margin: 0; }
button, select { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 20px 16px 48px; }

/* league header */
.top { display: flex; flex-direction: column; gap: 8px; padding-bottom: 10px; }
.toprow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
h1 { font-stretch: 70%; font-weight: 800; font-size: clamp(42px, 11vw, 68px); line-height: 0.92; letter-spacing: -0.01em; text-wrap: balance; }
.subrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; }
.meta { color: var(--muted); font-size: 13px; max-width: 58ch; }
.basis { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.basis .seg { display: inline-grid; padding: 2px; border-radius: 8px; }
.basis .seg button { min-height: 30px; padding: 3px 11px; border-radius: 6px; font-size: 13.5px; }
.mine label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
select { border: 1px solid var(--line); border-radius: 8px; background: var(--page); color: var(--ink); padding: 6px 8px; font-weight: 600; font-size: 16px; font-stretch: 90%; min-height: 40px; max-width: 100%; }

/* tabs: stay in view while you scroll */
.bar { position: sticky; top: 0; z-index: 5; background: var(--page); border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 18px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { all: unset; box-sizing: border-box; cursor: pointer; padding: 12px 1px 8px; border-bottom: 3px solid transparent; font-stretch: 82%; font-weight: 750; font-size: 18px; color: var(--muted); white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tabs button:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; border-radius: 4px; }
.tabs { align-items: flex-end; }
.tabs #tab-method { margin-left: auto; font-stretch: 92%; font-weight: 600; font-size: 13.5px; padding-bottom: 10px; }   /* reference, so it sits quietly at the end */
.reset { border: 1px solid var(--line); background: var(--page); border-radius: 8px; padding: 5px 10px; font-weight: 650; font-size: 13.5px; cursor: pointer; min-height: 34px; white-space: nowrap; }
@media (hover: hover) { .reset:hover { border-color: var(--ink); } }

.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 26px; padding-top: 18px; }
#main, #extra { min-width: 0; scroll-margin-top: 58px; }
@media (min-width: 940px) {
  .grid { grid-template-columns: minmax(0, 1fr) 356px; grid-template-areas: "main side" "extra side"; column-gap: 36px; align-items: start; }
  #main { grid-area: main; }
  #extra { grid-area: extra; }
  #whatif { grid-area: side; position: sticky; top: 62px; max-height: calc(100vh - 74px); overflow-y: auto; }
  .grid.solo { grid-template-columns: minmax(0, 1fr); grid-template-areas: "main"; }
}
.shead { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
h2 { font-stretch: 80%; font-weight: 800; font-size: 25px; line-height: 1.1; }
.note { color: var(--muted); font-size: 13.5px; max-width: 66ch; }
.shead .note { min-height: 1.45em; }
.foot { margin-top: 10px; }

/* your team */
.me-card { border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 10px 12px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 4px; }
.me-card .t { font-stretch: 86%; font-weight: 750; font-size: 16px; }
.me-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 12px; max-width: 400px; font-variant-numeric: tabular-nums; }
.me-stats span { display: block; }
.me-stats b { font-stretch: 85%; font-weight: 800; font-size: 21px; margin-right: 5px; }
.me-stats small { display: block; color: var(--muted); font-size: 12.5px; }
.me-stats .dl { font-size: 12.5px; }
.me-line { font-size: 14px; color: var(--muted); }
.me-line b { color: var(--ink); font-weight: 700; }
.dl { font-style: normal; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.dl.up { color: var(--up); }
.dl.down { color: var(--down); }

/* the heat tables */
table.odds { border-collapse: collapse; width: 100%; table-layout: fixed; font-variant-numeric: tabular-nums; }
table.odds col.c { width: 42px; }
table.odds col.t { width: 140px; }
table.odds thead th { font-size: 12px; font-weight: 600; color: var(--muted); padding: 0 0 6px; text-align: center; font-stretch: 88%; white-space: nowrap; }
table.odds thead th.team { text-align: left; padding-left: 22px; }
table.odds tbody tr.r > * { border-top: 1px solid var(--line); padding: 4px 0; vertical-align: middle; font-weight: 400; text-align: left; }
table.odds tbody tr.r.cut > * { border-top: 2px solid var(--ink); }
.tbtn { all: unset; box-sizing: border-box; position: relative; cursor: pointer; display: grid; grid-template-columns: 16px minmax(0, 1fr); align-items: center; column-gap: 6px; width: 100%; min-height: 44px; padding: 2px 18px 2px 0; }
.tbtn::after { content: ""; position: absolute; right: 7px; top: 50%; width: 5px; height: 5px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: translateY(-70%) rotate(45deg); }
.tbtn[aria-expanded="true"]::after { transform: translateY(-25%) rotate(-135deg); }
.tbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; border-radius: 6px; }
.tbtn .rk { color: var(--muted); font-size: 12.5px; text-align: center; line-height: 1.1; }
.tbtn .rk i { display: block; font-style: normal; font-size: 8px; color: var(--ink); }
.nm { display: block; font-stretch: 84%; font-weight: 650; font-size: 14.5px; line-height: 1.15; overflow-wrap: anywhere; }
@media (hover: hover) { .tbtn:hover .nm { text-decoration: underline; text-underline-offset: 3px; } }
.sub { display: block; color: var(--muted); font-size: 12px; line-height: 1.3; font-stretch: 92%; overflow-wrap: anywhere; }
.sub.to { color: var(--accent); font-weight: 600; }
tr.me .tbtn .nm, tr.me .tbtn .rk { color: var(--accent); }
tr.me .tbtn .rk { font-weight: 800; }
.nm .s { display: none; }
.chip { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 1.5px; min-height: 36px; border-radius: 6px; font-stretch: 84%; font-weight: 700; font-size: 14px; line-height: 1.1; color: #000; cursor: default; }
.chip.hi { color: #fff; }
.chip.nil { background: transparent; color: var(--muted); font-weight: 500; }
.chip .d { font-size: 10.5px; font-weight: 600; }
.striph, .strip { display: grid; grid-template-columns: repeat(var(--n, 12), minmax(0, 1fr)); gap: 2px; }
.striph span { font-size: 11px; font-weight: 600; color: var(--muted); text-align: center; }
.stripg { display: grid; grid-template-columns: repeat(var(--n, 12), minmax(0, 1fr)); gap: 2px; margin-bottom: 4px; }
.stripg span { padding-bottom: 2px; border-bottom: 1.5px solid var(--line); font-size: 10.5px; font-weight: 600; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; }
.cell { height: 36px; border-radius: 4px; background: var(--soft); display: flex; align-items: center; justify-content: center; font-stretch: 76%; font-weight: 700; font-size: 10.5px; color: #000; cursor: default; }
.cell.hi { color: #fff; }
tr.det > td { padding: 0 0 12px; }
.detail { background: var(--soft); border-radius: 10px; padding: 14px 12px; display: flex; flex-direction: column; gap: 16px; }
.dhead { display: flex; flex-direction: column; gap: 2px; }
.dhead b { font-stretch: 86%; font-weight: 750; font-size: 17px; line-height: 1.2; }
.dhead span { color: var(--muted); font-size: 13.5px; }
.dgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px 28px; }
.dgrid > div { min-width: 0; }
.detail h4 { font-size: 13.5px; font-weight: 700; margin-bottom: 6px; }
table.mini { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
table.mini th, table.mini td { padding: 5px 0 5px 8px; text-align: right; border-top: 1px solid var(--line); font-weight: 400; }
table.mini thead th { border-top: 0; padding-top: 0; font-size: 12px; font-weight: 600; color: var(--muted); }
table.mini th:first-child { text-align: left; padding-left: 0; }
table.mini tbody th { font-weight: 650; }
.detail .note { margin-top: 6px; }
ul.swing { list-style: none; padding: 0; display: flex; flex-direction: column; }
ul.swing li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13.5px; font-variant-numeric: tabular-nums; }
ul.swing li b { font-weight: 700; }
ul.swing .v { white-space: nowrap; color: var(--muted); }
ul.swing .v b { color: var(--ink); }
svg.bars { width: 100%; height: auto; display: block; }
svg.bars text { font-family: var(--font); font-size: 11.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
svg.bars text.v { fill: var(--ink); font-weight: 650; }
svg.bars .bar { fill: var(--accent); }
svg.bars .bar.out { fill: #8d98a3; }
svg.bars .hit { fill: transparent; }
svg.bars line { stroke: #c4ccd4; }

/* lineups tab: one card per team; in a regular-season week each joined pair is a matchup */
.wkseg { max-width: 420px; margin-bottom: 14px; }
.lgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 8px; }
.lgrid.pairs { grid-template-columns: minmax(0, 1fr); gap: 12px; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.lcard { border: 1px solid var(--line); border-radius: 10px; padding: 10px 8px 8px; min-width: 0; scroll-margin-top: 70px; }
.pair .lcard { border: 0; border-radius: 0; }
.pair .lcard + .lcard { border-left: 1px solid var(--line); }
.lcard.me { background: var(--accent-soft); }
.lhead { display: flex; flex-direction: column; gap: 1px; padding-bottom: 6px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }
.lname { font-stretch: 84%; font-weight: 700; font-size: 14px; line-height: 1.15; min-height: 2.3em; overflow-wrap: anywhere; }
.ltot { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ltot b { font-stretch: 85%; font-weight: 800; font-size: 21px; color: var(--ink); margin-right: 4px; }
.lsub { font-size: 12px; color: var(--muted); }
.lrow { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 5px; align-items: baseline; padding: 2.5px 0; font-size: 13px; font-variant-numeric: tabular-nums; }
.lrow .sl { color: var(--muted); font-size: 11px; font-stretch: 88%; }
.lrow .pl { font-stretch: 88%; overflow-wrap: anywhere; }
.lrow .pts { font-weight: 600; }
.pl .s { display: none; }
.fa { margin-left: 4px; padding: 0 3px; border: 1px solid currentColor; border-radius: 3px; font-size: 9.5px; font-weight: 700; color: var(--accent); vertical-align: 1px; cursor: default; }
.ptab { margin-top: 32px; }
table.pts thead th.team { padding-left: 0; }
table.pts tr.me .nm { color: var(--accent); }

/* who holds the picks: one column per round, darker = worth more, ringed = came in a trade */
table.own { border-collapse: collapse; width: 100%; table-layout: fixed; }
table.own col.c { width: 50px; }
table.own th, table.own td { border-top: 1px solid var(--line); padding: 8px 0 3px; vertical-align: top; text-align: left; font-weight: 400; }
table.own td { border-left: 1px solid var(--line); padding-left: 4px; padding-right: 3px; }
table.own thead th { border-top: 0; border-left: 0; font-size: 12px; font-weight: 600; color: var(--muted); padding: 0 0 6px 4px; font-stretch: 88%; }
table.own thead th:first-child { padding-left: 0; }
table.own tbody th { padding-right: 6px; }
table.own tr.me .nm { color: var(--accent); }
.cap { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums; }
.cap i { display: block; height: 5px; min-width: 2px; border-radius: 3px; background: var(--accent); }
.pk { display: flex; align-items: center; justify-content: center; height: 22px; margin: 0 0 6px; border-radius: 5px; font-stretch: 80%; font-weight: 700; font-size: 12px; font-variant-numeric: tabular-nums; color: #000; cursor: default; }
.pk.hi { color: #fff; }
.pk.got { outline: 1.5px solid var(--ink); outline-offset: 1px; }
.none { display: block; text-align: center; color: var(--muted); font-size: 13px; line-height: 22px; }

/* what-if panel */
.whatif { background: var(--soft); border-radius: 14px; padding: 16px 12px; display: flex; flex-direction: column; gap: 12px; min-width: 0; scroll-margin-top: 58px; }
.wihead { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 34px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; padding: 3px; border-radius: 10px; background: #e6eaee; }
.seg button { border: 0; background: transparent; border-radius: 7px; padding: 6px 8px; min-height: 36px; font-weight: 650; font-size: 14px; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.seg .cnt { background: var(--accent); color: #fff; border-radius: 99px; min-width: 18px; height: 18px; padding: 0 5px; font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
.games { display: flex; flex-direction: column; gap: 6px; }
.game { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2px; }
.side { border: 0; background: var(--page); cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 46px; padding: 4px 10px; text-align: left; border-radius: 9px 3px 3px 9px; }
.side.b { flex-direction: row-reverse; text-align: right; border-radius: 3px 9px 9px 3px; }
.side .nm { font-size: 14.5px; }
.side .wp { flex: none; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.side.fav .wp { color: var(--ink); font-weight: 700; }
.side svg { flex: none; width: 16px; height: 16px; }
.side.lost { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
@media (hover: hover) { .side:hover { box-shadow: inset 0 0 0 1.5px var(--ink); } }
.side[aria-pressed="true"] { background: var(--accent); color: #fff; box-shadow: none; }
.side.mine .nm::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: currentColor; vertical-align: 2px; }
.changes { display: flex; flex-direction: column; gap: 4px; }
.changes h3 { font-size: 14px; font-weight: 700; }
.changes ul { list-style: none; padding: 0; display: flex; flex-direction: column; }
.changes li { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 0 12px; padding: 6px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.changes .who b { display: block; font-stretch: 86%; font-weight: 650; font-size: 14.5px; line-height: 1.2; }
.changes .who span { display: block; color: var(--muted); font-size: 12px; }
.changes .vals { font-size: 14px; white-space: nowrap; text-align: right; }
.changes .vals .dl { display: inline-block; min-width: 44px; margin-left: 8px; text-align: right; font-size: 13.5px; }
.linkbtn { all: unset; cursor: pointer; color: var(--accent); font-weight: 650; font-size: 13.5px; text-decoration: underline; text-underline-offset: 3px; align-self: flex-start; padding: 6px 0; }
.linkbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.linkbtn.inl { padding: 0; font-size: inherit; }

/* how-it-works tab */
.method { padding-top: 18px; display: flex; flex-direction: column; gap: 18px; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px 36px; }
.cols h3 { font-size: 16px; font-weight: 750; margin-bottom: 6px; }
.cols p, .cols li { font-size: 14.5px; max-width: 64ch; }
.cols p + p { margin-top: 8px; }
.cols ul { padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.cols b { font-weight: 650; }
table.cal { border-collapse: collapse; margin-top: 12px; font-size: 13.5px; font-variant-numeric: tabular-nums; }
table.cal th, table.cal td { padding: 3px 16px 3px 0; text-align: right; }
table.cal th { font-weight: 600; color: var(--muted); font-size: 12.5px; }
table.cal caption { text-align: left; font-weight: 650; padding-bottom: 4px; }
footer { margin-top: 26px; color: var(--muted); font-size: 13px; max-width: 84ch; }
#tip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: #fff; padding: 6px 9px; border-radius: 7px; font-size: 13px; max-width: 240px; line-height: 1.3; font-variant-numeric: tabular-nums; }

@media (max-width: 359px) {
  table.odds col.c { width: 40px; }
  table.odds col.t { width: 112px; }
  .chip { margin: 0 1px; }
}
@media (max-width: 374px) {             /* very narrow phones: short team names everywhere */
  .nm .f { display: none; }
  .nm .s { display: inline; }
}
@media (max-width: 400px) {
  .tabs { gap: 14px; }
  .tabs button { font-size: 17px; }
}
@media (max-width: 559px) {
  .nm.tight .f, .pl .f { display: none; }   /* tight grids keep short names on a phone */
  .nm.tight .s, .pl .s { display: inline; }
  .tbtn .nm { font-size: 14px; font-stretch: 80%; }
  .chip { font-size: 13.5px; }
  table.pts .chip { font-size: 12.5px; }
}
@media (min-width: 560px) {
  .wrap { padding: 28px 24px 56px; }
  table.odds col.c { width: 64px; }
  table.odds col.t { width: 236px; }
  table.own col.c { width: 100px; }
  .pk { display: inline-flex; width: 42px; margin-right: 5px; }
  .tbtn { grid-template-columns: 20px minmax(0, 1fr); column-gap: 8px; }
  table.odds thead th.team { padding-left: 28px; }
  .nm { font-size: 15.5px; }
  .chip { margin: 0 2px; font-size: 15px; }
  .cell { font-size: 12px; font-stretch: 84%; }
  .striph span { font-size: 12px; }
  .detail { padding: 16px; }
  .dgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dgrid > .wide { grid-column: 1 / -1; }
  .whatif { padding: 18px 16px; }
}
@media (min-width: 760px) {
  .lgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .lgrid.pairs { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .lcard { padding: 12px 12px 10px; }
  .lname { font-size: 15px; }
  .lrow { grid-template-columns: 36px minmax(0, 1fr) auto; font-size: 13.5px; }
}
@media (min-width: 940px) {
  .cols { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .totop { display: none; }               /* the what-if panel sits beside the table here */
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="toprow">
      <h1>__LEAGUE__</h1>
      <div class="mine"><label for="mine">Your team</label><select id="mine"></select></div>
    </div>
    <div class="subrow">
      <p class="meta">__META__</p>
      <div class="basis" id="basis">
        <span id="basis-l">Rate teams by</span>
        <span class="seg" role="group" aria-labelledby="basis-l">
          <button type="button" id="blend-mix" data-blend="0.5" data-tip="Blend: half season scoring, half projected lineups. The default.">Blend</button>
          <button type="button" id="blend-form" data-blend="0" data-tip="Season: only how each team has scored this year.">Season</button>
          <button type="button" id="blend-proj" data-blend="1" data-tip="Projections: only Sleeper’s forecast for each team’s best lineup.">Projections</button>
        </span>
      </div>
    </div>
  </header>

  <div class="bar">
    <div class="tabs" role="tablist" aria-label="View">

    } else box.appendChild(el('p', { class: 'note', text: state.tab === 'playoffs' ? 'No team’s playoff, bye or title odds move by a full point.' : 'No first-round pick moves by much.' }));
    box.appendChild(el('button', { type: 'button', class: 'linkbtn totop', 'data-k': 'totop', text: 'See every team in the table', onclick: function () {
      var smooth = !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      $('main').scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
    } }));
    host.appendChild(box);
    refocus(keep);
  }

  /* ---------- actions ---------- */
  function renderAll() {
    var data = state.tab === 'playoffs' || state.tab === 'draft', method = state.tab === 'method';
    renderBar();
    $('grid').hidden = method; $('method-panel').hidden = !method;
    $('grid').className = 'grid' + (data ? '' : ' solo'); $('whatif').hidden = !data;   // picks only matter on the two odds tabs
    renderMain(); renderExtra(); if (data) renderPicker();
  }
  function run() { compute(); stale = false; renderAll(); }
  function setPick(gi, v) {
    state.picks[gi] = v; stale = true;
    renderBar(); renderPicker();                       // the tap shows at once; the numbers follow
    var id = ++pending; setTimeout(function () { if (id === pending) run(); }, 30);
  }
  function resetPicks() { state.picks = new Array(G).fill(0); pending++; run(); }
  function toggleOpen(i) { state.open = state.open === i ? -1 : i; renderMain(); }
  function setTab(t, quiet) {
    if (TABS.indexOf(t) < 0) return;
    state.tab = t;
    if (!quiet) { try { if (location.hash !== '#' + t) location.hash = t; } catch (e) {} }
    renderAll();
    var bar = document.querySelector('.bar'), panel = t === 'method' ? $('method-panel') : $('grid');
    if (bar.getBoundingClientRect().top <= 0) window.scrollTo(0, Math.max(0, (window.pageYOffset || 0) + panel.getBoundingClientRect().top - bar.offsetHeight));   // tabs pinned: open the new tab at its top
  }

  /* one tooltip for chips, cells and bars: hover with a mouse, tap on a phone */
  var tip = $('tip'), tipTimer = 0;
  function showTip(tgt, x, y) {
    tip.textContent = tgt.getAttribute('data-tip'); tip.hidden = false;
    var left = Math.min(window.innerWidth - tip.offsetWidth - 8, x + 14), top = y + 16;
    if (top + tip.offsetHeight > window.innerHeight - 8) top = y - tip.offsetHeight - 10;
    tip.style.left = Math.max(8, left) + 'px'; tip.style.top = Math.max(8, top) + 'px';
  }
  function tipTarget(ev) { return ev.target && ev.target.closest ? ev.target.closest('[data-tip]') : null; }
  document.addEventListener('pointermove', function (ev) { if (ev.pointerType === 'touch') return; var t = tipTarget(ev); if (t) showTip(t, ev.clientX, ev.clientY); else tip.hidden = true; });
  document.addEventListener('click', function (ev) {
    var t = tipTarget(ev); clearTimeout(tipTimer);
    if (!t) { tip.hidden = true; return; }
    showTip(t, ev.clientX, ev.clientY); tipTimer = setTimeout(function () { tip.hidden = true; }, 2800);
  });
  window.addEventListener('scroll', function () { tip.hidden = true; }, true);

  function start(saved) {
    try { var r = Number(localStorage.getItem('league-odds-team')); T.forEach(function (t, i) { if (t.rid === r) state.mine = i; }); } catch (e) {}
    if (saved && typeof saved === 'object') {
      if (Array.isArray(saved.picks)) state.picks = saved.picks;
      if (typeof saved.blend === 'number') state.blend = saved.blend;
      if (typeof saved.open === 'number') state.open = saved.open;
      if (typeof saved.week === 'number') state.week = saved.week;
      if (TABS.indexOf(saved.tab) >= 0) state.tab = saved.tab;
    }
    var h = (location.hash || '').replace('#', ''); if (TABS.indexOf(h) >= 0) state.tab = h;
    TABS.forEach(function (t) { $('tab-' + t).addEventListener('click', function () { setTab(t); }); });
    document.querySelector('.tabs').addEventListener('keydown', function (ev) {
      if (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight') return;
      var t = TABS[(TABS.indexOf(state.tab) + (ev.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length]; setTab(t); $('tab-' + t).focus();
    });
    window.addEventListener('hashchange', function () { var x = (location.hash || '').replace('#', ''); if (TABS.indexOf(x) >= 0 && x !== state.tab) setTab(x, true); });
    $('mine').addEventListener('change', function () {
      state.mine = Number($('mine').value);
      try { if (state.mine >= 0) localStorage.setItem('league-odds-team', String(T[state.mine].rid)); else localStorage.removeItem('league-odds-team'); } catch (e) {}
      renderAll();
    });
    Array.prototype.forEach.call(document.querySelectorAll('#basis button'), function (b) { b.addEventListener('click', function () { state.blend = Number(b.getAttribute('data-blend')); run(); }); });
    run();
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(function () { return { picks: state.picks, blend: state.blend, open: state.open, week: state.week, tab: state.tab }; });
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
